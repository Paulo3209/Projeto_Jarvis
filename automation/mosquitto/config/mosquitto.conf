# JARVIS MQTT Broker Configuration
# Mosquitto 2.0+

# ==================== LISTENERS ====================

# MQTT padrão (TCP)
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# WebSockets (para clientes web/Termux)
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

# ==================== PERSISTENCE ====================

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 30
autosave_on_changes false

# ==================== LOGGING ====================

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S
connection_messages true

# ==================== SECURITY ====================

# Tamanho máximo de payload (1MB)
message_size_limit 1048576

# QoS máximo permitido
max_qos 2

# Keep alive
keepalive_interval 60

# ==================== BRIDGE (opcional - para conectar a outro broker) ====================

# connection jarvis-bridge
# address cloud-broker:8883
# topic jarvis/# both 2
# remote_username user
# remote_password pass
# bridge_cafile /mosquitto/certs/ca.crt
# bridge_certfile /mosquitto/certs/client.crt
# bridge_keyfile /mosquitto/certs/client.key
# try_private false
# cleansession true
# start_type automatic

# ==================== ACL (Access Control List) ====================

# Padrão: nega tudo, permite explicitamente
# Necessita: acl_file /mosquitto/config/acl.conf

# ==================== OUTROS ====================

# Máximo de conexões simultâneas
max_connections -1

# InfluxDB não suportado nativamente, use exporter

# Plugins (se compilado com)
# plugin /usr/lib/mosquitto_dynamic_security.so