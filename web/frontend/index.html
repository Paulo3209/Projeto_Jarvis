<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Web UI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.5rem; color: #58a6ff; }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-online { background: #238636; color: #fff; }
        .status-offline { background: #da3633; color: #fff; }
        .status-warning { background: #d29922; color: #0d1117; }

        main { flex: 1; display: grid; grid-template-columns: 1fr 350px; gap: 1rem; padding: 1rem; }
        @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

        .panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        .panel h2 { font-size: 1rem; margin-bottom: 1rem; color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }

        /* Chat */
        .chat-container { flex: 1; display: flex; flex-direction: column; min-height: 400px; }
        .messages { flex: 1; overflow-y: auto; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .msg { max-width: 85%; padding: 0.75rem 1rem; border-radius: 12px; line-height: 1.5; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-user { align-self: flex-end; background: #238636; color: #fff; border-bottom-right-radius: 4px; }
        .msg-assistant { align-self: flex-start; background: #21262d; color: #c9d1d9; border-bottom-left-radius: 4px; }
        .msg-system { align-self: center; background: #30363d; color: #8b949e; font-size: 0.8rem; max-width: 100%; text-align: center; }
        .msg-streaming { border-right: 2px solid #58a6ff; }

        .chat-input { display: flex; gap: 0.5rem; padding: 0.5rem; border-top: 1px solid #30363d; }
        .chat-input input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 0.75rem 1rem; border-radius: 8px; font-size: 1rem; }
        .chat-input input:focus { outline: none; border-color: #58a6ff; }
        .chat-input button { background: #238636; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .chat-input button:hover { background: #2ea043; }
        .chat-input button:disabled { background: #30363d; cursor: not-allowed; }

        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 1rem; }
        .metric { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #30363d; }
        .metric:last-child { border-bottom: none; }
        .metric-label { color: #8b949e; font-size: 0.85rem; }
        .metric-value { font-family: monospace; font-size: 0.85rem; }

        .config-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .config-group label { font-size: 0.8rem; color: #8b949e; }
        .config-group select, .config-group input[type="range"] { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 0.5rem; border-radius: 6px; }
        .config-group select:focus { outline: none; border-color: #58a6ff; }

        .btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; width: 100%; }
        .btn:hover { background: #30363d; }
        .btn.primary { background: #238636; border-color: #238636; }
        .btn.danger { background: #da3633; border-color: #da3633; }

        .microphones { display: flex; flex-direction: column; gap: 0.25rem; max-height: 200px; overflow-y: auto; }
        .mic-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; }
        .mic-item:hover { border-color: #58a6ff; }
        .mic-item.active { border-color: #238636; background: #1a2e1a; }
        .mic-item input[type="radio"] { accent-color: #238636; }

        .log { font-family: monospace; font-size: 0.75rem; color: #8b949e; max-height: 150px; overflow-y: auto; background: #0d1117; padding: 0.5rem; border-radius: 6px; }
        .log-entry { padding: 0.25rem 0; border-bottom: 1px solid #21262d; }
        .log-entry:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 JARVIS Web UI</h1>
        <span id="connectionStatus" class="status-badge status-offline">Desconectado</span>
    </header>

    <main>
        <!-- Chat Panel -->
        <div class="panel chat-container">
            <h2>💬 Chat</h2>
            <div id="messages" class="messages">
                <div class="msg msg-system">Bem-vindo ao JARVIS Web UI. Digite uma mensagem ou use comandos de voz.</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem... (Enter para enviar)" autocomplete="off">
                <button id="sendBtn" disabled>Enviar</button>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="panel sidebar">
            <!-- Status -->
            <div>
                <h2>📊 Status</h2>
                <div class="metric">
                    <span class="metric-label">LLM</span>
                    <span id="llmStatus" class="metric-value">—</span>
                </div>
                <div class="metric">
                    <span class="metric-label">TTS</span>
                    <span id="ttsStatus" class="metric-value">—</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Voice Gate</span>
                    <span id="gateStatus" class="metric-value">—</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Tools</span>
                    <span id="toolsCount" class="metric-value">—</span>
                </div>
            </div>

            <!-- Config LLM -->
            <div>
                <h2>🧠 LLM</h2>
                <div class="config-group">
                    <label>Provedor</label>
                    <select id="llmProvider" onchange="setLLMProvider(this.value)">
                        <option value="ollama">Ollama (Local)</option>
                        <option value="gemini">Gemini (Cloud)</option>
                    </select>
                </div>
                <div class="config-group">
                    <label>Modelo</label>
                    <select id="llmModel" onchange="setLLMModel(this.value)">
                        <option value="gemma3:4b">Gemma 3 4B</option>
                        <option value="llama3.1:8b">Llama 3.1 8B</option>
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                    </select>
                </div>
            </div>

            <!-- Config TTS -->
            <div>
                <h2>🔊 TTS</h2>
                <div class="config-group">
                    <label>Provedor</label>
                    <select id="ttsProvider" onchange="setTTSProvider(this.value)">
                        <option value="kokoro">Kokoro (Local)</option>
                        <option value="edge_tts">edge-tts (Cloud)</option>
                    </select>
                </div>
            </div>

            <!-- Voice Gate -->
            <div>
                <h2>🔐 Voice Gate</h2>
                <div class="config-group">
                    <label>Modo</label>
                    <select id="gateMode" onchange="setGateMode(this.value)">
                        <option value="disabled">Desativado</option>
                        <option value="verify_sensitive">Sensíveis</option>
                        <option value="verify_all">Todos</option>
                    </select>
                </div>
                <div class="config-group">
                    <label>Threshold: <span id="gateThresholdVal">0.82</span></label>
                    <input type="range" id="gateThreshold" min="0.5" max="0.99" step="0.01" value="0.82" oninput="updateGateThreshold(this.value)">
                </div>
            </div>

            <!-- Microfones -->
            <div>
                <h2>🎤 Microfones</h2>
                <div id="micList" class="microphones">Carregando...</div>
                <button class="btn" onclick="refreshMics()" style="margin-top: 0.5rem;">🔄 Atualizar</button>
            </div>

            <!-- Clap Detector -->
            <div>
                <h2>👏 Clap Detector</h2>
                <div class="config-group">
                    <label>Threshold: <span id="clapThresholdVal">0.08</span></label>
                    <input type="range" id="clapThreshold" min="0.01" max="0.5" step="0.01" value="0.08" oninput="updateClapThreshold(this.value)">
                </div>
                <button class="btn" onclick="startClap()">▶️ Iniciar</button>
                <button class="btn" onclick="stopClap()" style="margin-top: 0.5rem;">⏹️ Parar</button>
                <button class="btn primary" onclick="calibrateClap()" style="margin-top: 0.5rem;">🔧 Calibrar (10s)</button>
            </div>

            <!-- Diagnostics -->
            <div>
                <h2>🩺 Diagnostics</h2>
                <button class="btn" onclick="runDoctor()">Executar jarvis doctor</button>
                <div id="doctorOutput" class="log" style="margin-top: 0.5rem; display: none;"></div>
            </div>

            <!-- Logs -->
            <div>
                <h2>📜 Logs</h2>
                <div id="logOutput" class="log"></div>
            </div>
        </div>
    </main>

    <script>
        // ==================== WS & STATE ====================
        let ws = null;
        let selectedMic = null;
        let streamingMsgId = null;

        function connect() {
            ws = new WebSocket(`ws://${location.host}/ws`);
            ws.onopen = () => {
                setStatus('connectionStatus', 'Conectado', 'online');
                log('Sistema', 'WebSocket conectado');
            };
            ws.onclose = () => {
                setStatus('connectionStatus', 'Desconectado', 'offline');
                log('Sistema', 'WebSocket desconectado. Reconectando em 3s...');
                setTimeout(connect, 3000);
            };
            ws.onerror = (e) => log('Erro', 'WebSocket error');
            ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'init':
                    updateStatus(msg.data);
                    break;
                case 'token':
                    appendToken(msg.data.token);
                    break;
                case 'done':
                    finishStreaming();
                    break;
                case 'user_message':
                    addMessage('user', msg.data.message);
                    break;
                case 'assistant_complete':
                    finishStreaming();
                    break;
                case 'tool_called':
                    log('Tool', `Chamada: ${msg.data.name}(${JSON.stringify(msg.data.arguments)})`);
                    break;
                case 'status_change':
                    log('Status', msg.data.status);
                    if (msg.data.status === 'clap_detected') {
                        addMessage('system', '👏 Double clap detectado!');
                    }
                    break;
                case 'error':
                    log('Erro', msg.data.error);
                    break;
                case 'config_result':
                    if (msg.success) {
                        log('Config', 'Atualizada com sucesso');
                        refreshStatus();
                    } else {
                        log('Config', `Erro: ${msg.error}`);
                    }
                    break;
                case 'pong':
                    break;
            }
        }

        function send(type, data = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type, ...data }));
            }
        }

        // ==================== UI HELPERS ====================
        function setStatus(id, text, cls) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = `status-badge status-${cls}`;
        }

        function addMessage(role, content) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg msg-${role}`;
            div.textContent = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function appendToken(token) {
            if (!streamingMsgId) {
                streamingMsgId = addMessage('assistant', '');
                streamingMsgId.classList.add('msg-streaming');
            }
            streamingMsgId.textContent += token;
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function finishStreaming() {
            streamingMsgId = null;
        }

        function log(source, text) {
            const log = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<div class="log-entry">[${time}] <b>${source}:</b> ${text}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateStatus(data) {
            if (!data) return;
            document.getElementById('llmStatus').textContent = data.llm?.current_provider || '—';
            document.getElementById('ttsStatus').textContent = data.tts?.current_provider || '—';
            document.getElementById('gateStatus').textContent = data.voice_gate || '—';
            document.getElementById('toolsCount').textContent = data.llm?.tools_count || '—';

            // Microfones
            if (data.microphones) {
                const list = document.getElementById('micList');
                list.innerHTML = data.microphones.map(m => `
                    <label class="mic-item${selectedMic === m.index ? ' active' : ''}">
                        <input type="radio" name="mic" value="${m.index}" ${selectedMic === m.index ? 'checked' : ''} onchange="selectMic(${m.index})">
                        <span>${m.name}</span>
                        <small style="color:#8b949e;">${m.sample_rate}Hz</small>
                    </label>
                `).join('');
            }
        }

        function refreshStatus() {
            fetch('/api/status').then(r => r.json()).then(updateStatus);
        }

        // ==================== CHAT ====================
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });
        document.getElementById('sendBtn').addEventListener('click', sendChat);
        document.getElementById('chatInput').addEventListener('input', (e) => {
            document.getElementById('sendBtn').disabled = !e.target.value.trim();
        });

        function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            document.getElementById('sendBtn').disabled = true;
            addMessage('user', text);
            send('chat', { message: text, personality: 'default' });
        }

        // ==================== CONFIG HANDLERS ====================
        function setLLMProvider(val) { send('config', { config: { llm: { provider: val } } }); }
        function setLLMModel(val) { send('config', { config: { llm: { model: val } } }); }
        function setTTSProvider(val) { send('config', { config: { tts: { provider: val } } }); }
        function setGateMode(val) { send('config', { config: { voice_gate: { mode: val } } }); }
        function setGateThreshold(val) { send('config', { config: { voice_gate: { threshold: parseFloat(val) } } }); }
        function updateGateThreshold(val) { document.getElementById('gateThresholdVal').textContent = val; }
        function updateClapThreshold(val) { document.getElementById('clapThresholdVal').textContent = val; }

        function selectMic(index) {
            selectedMic = index;
            refreshStatus();
            log('Mic', `Microfone ${index} selecionado`);
        }

        function refreshMics() { refreshStatus(); }

        // ==================== CLAP DETECTOR ====================
        function startClap() {
            const th = parseFloat(document.getElementById('clapThreshold').value);
            fetch('/api/clap_detector/start', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ threshold: th, mic_index: selectedMic })
            }).then(r => r.json()).then(res => {
                log('Clap', res.success ? 'Iniciado' : `Erro: ${res.message}`);
                refreshStatus();
            });
        }
        function stopClap() {
            fetch('/api/clap_detector/stop', { method: 'POST' })
                .then(r => r.json()).then(res => log('Clap', res.message || 'Parado'));
        }
        function calibrateClap() {
            log('Clap', 'Calibrando por 10s... faça barulho normal');
            fetch('/api/clap_detector/calibrate', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ duration: 10 })
            }).then(r => r.json()).then(res => {
                if (res.success) {
                    document.getElementById('clapThreshold').value = res.suggested_threshold;
                    document.getElementById('clapThresholdVal').textContent = res.suggested_threshold;
                    log('Clap', `Calibrado: ${res.suggested_threshold}`);
                }
            });
        }

        // ==================== DOCTOR ====================
        async function runDoctor() {
            const out = document.getElementById('doctorOutput');
            out.style.display = 'block';
            out.textContent = 'Executando...';
            try {
                const res = await fetch('/api/doctor');
                const data = await res.json();
                out.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                out.textContent = `Erro: ${e}`;
            }
        }

        // ==================== INIT ====================
        connect();
        refreshStatus();
        setInterval(refreshStatus, 10000);
    </script>
</body>
</html>
